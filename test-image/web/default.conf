server {
    listen 3000;
    server_name _;

    # ALB 타겟그룹 헬스체크 경로 (modules/load_balancer/main.tf 의 health_check.path)
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        default_type text/html;
        return 200 "<h1>clduck-web test ok</h1>\n";
    }
}
